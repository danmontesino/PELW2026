<html>
<head>
    <title>Formulario</title>
</head>
<body>
    <form> 
    Nombre:<br>
      <input type="text" name="nombre">
<br>
    
    Correo:<br>
      <input type="text" name="correo">
<br>

    Pais de origen:<br>
      <select name="pais">

     <option selected>Seleccione país</option>

        <option>Argentina</option>
        <option>Chile</option>
        <option>Uruguay</option>
        <option>Paraguay</option>
        <option>Brasil</option>

      </select>
<br>

     Valoración del sitio:<br>

      <input type="radio" name="valoracion" value="malo"> Malo.
<br>
      <input type="radio" name="valoracion" value="regular"> Regular.
<br>
      <input type="radio" name="valoracion" value="bueno" checked> Bueno.
<br>
      <input type="radio" name="valoracion" value="muybueno"> Muy bueno.
<br>
      <input type="radio" name="valoracion" value="excelente"> Excelente.
<br>

    Comentarios:
<br>

     <textarea name="comentarios" rows="4" cols="40">

     </textarea>
 <br>

    <input type="submit" value="Enviar">
    <input type="reset" value="Borrar">

  </form>
</body>
</html>
